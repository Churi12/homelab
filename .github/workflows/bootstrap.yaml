---
name: Bootstrap Cluster and ArgoCD

on:
  push:
    branches:
      - main
      - copilot/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: Run yamllint
        run: yamllint .

      - name: Run shellcheck
        run: shellcheck bootstrap/bootstrap.sh

  bootstrap:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install k3d
        run: |
          curl -s \
            https://raw.githubusercontent.com/k3d-io/k3d/v5.6.0/install.sh \
            | bash

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.28.6

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Run bootstrap script
        run: |
          chmod +x bootstrap/bootstrap.sh
          CLEANUP_ON_EXIT=false bootstrap/bootstrap.sh

      - name: Verify ArgoCD installation
        run: |
          kubectl get deployment -n argocd
          kubectl get pods -n argocd

      - name: Check ArgoCD server
        run: |
          kubectl wait --for=condition=available \
            --timeout=60s \
            deployment/argocd-server \
            -n argocd

      - name: Verify Grafana is healthy
        run: |
          kubectl wait --for=condition=available \
            --timeout=60s \
            deployment/monitoring-grafana \
            -n monitoring
          kubectl get pods -n monitoring

      - name: Apply root app-of-apps and sync to current branch
        run: |
          TARGET_REVISION="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-main}}"
          echo "ArgoCD target revision: ${TARGET_REVISION}"
          kubectl apply -f apps/root.yaml
          kubectl patch application root -n argocd \
            --type=merge \
            -p "{\"spec\":{\"source\":{\"targetRevision\":\"${TARGET_REVISION}\"}}}"
          echo "Root Application applied and configured for branch: ${TARGET_REVISION}"

      - name: Wait for root Application to sync
        run: |
          echo "Waiting for root Application to sync..."
          for i in $(seq 1 60); do
            STATUS=$(kubectl get application root -n argocd \
              -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")
            echo "  Root sync status: ${STATUS} (attempt ${i}/60)"
            if [[ "${STATUS}" == "Synced" ]]; then
              echo "Root Application is Synced"
              break
            fi
            sleep 5
          done

      - name: Wait for demo-app Application to be discovered and patch its branch
        run: |
          TARGET_REVISION="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-main}}"
          echo "Waiting for demo-app Application to be created by root sync..."
          for i in $(seq 1 60); do
            if kubectl get application demo-app -n argocd &>/dev/null 2>&1; then
              echo "demo-app Application found after ${i} attempts"
              break
            fi
            echo "  Waiting... (attempt ${i}/60)"
            sleep 5
          done
          kubectl patch application demo-app -n argocd \
            --type=merge \
            -p "{\"spec\":{\"source\":{\"targetRevision\":\"${TARGET_REVISION}\"}}}"
          echo "demo-app Application patched for branch: ${TARGET_REVISION}"

      - name: Verify demo app pod is running and healthy
        run: |
          echo "Waiting for demo-app pod to be ready..."
          kubectl wait --for=condition=ready pod \
            -l app=demo-app \
            -n demo \
            --timeout=300s
          echo "Demo app pod is running"
          kubectl get pods -n demo

      - name: Verify Tempo pod is healthy
        run: |
          echo "Waiting for Tempo pod to be ready..."
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=tempo \
            -n monitoring \
            --timeout=300s
          echo "Tempo pod is running"
          kubectl get pods -n monitoring

      # A Ready Tempo pod does not prove the OTLP receivers are listening or
      # that a trace can be read back. Push one span over OTLP HTTP and query
      # it again by trace ID, which exercises the whole write and read path.
      - name: Verify Tempo ingests and returns a trace
        run: |
          kubectl port-forward -n monitoring svc/tempo 3100:3100 4318:4318 &
          PF_PID=$!
          trap 'kill ${PF_PID} 2>/dev/null || true' EXIT

          echo "Waiting for the port-forward to accept connections..."
          for i in $(seq 1 15); do
            if curl -sf --max-time 3 http://localhost:3100/ready >/dev/null; then
              echo "Tempo is ready to serve queries"
              break
            fi
            if [[ ${i} -eq 15 ]]; then
              echo "Tempo did not become queryable"
              exit 1
            fi
            sleep 4
          done

          TRACE_ID=$(openssl rand -hex 16)
          SPAN_ID=$(openssl rand -hex 8)
          NOW_NS=$(($(date -u +%s) * 1000000000))
          END_NS=$((NOW_NS + 1000000))
          echo "Pushing trace ${TRACE_ID} over OTLP HTTP..."

          # OTLP HTTP accepts the protobuf schema encoded as JSON, so a single
          # span can be pushed with curl and no instrumented application.
          jq -n \
            --arg trace_id "${TRACE_ID}" \
            --arg span_id "${SPAN_ID}" \
            --arg start "${NOW_NS}" \
            --arg end "${END_NS}" \
            '{resourceSpans: [{
               resource: {attributes: [{
                 key: "service.name",
                 value: {stringValue: "bootstrap-ci"}
               }]},
               scopeSpans: [{
                 scope: {name: "bootstrap-workflow"},
                 spans: [{
                   traceId: $trace_id,
                   spanId: $span_id,
                   name: "ci-smoke-span",
                   kind: 1,
                   startTimeUnixNano: $start,
                   endTimeUnixNano: $end
                 }]
               }]
             }]}' > /tmp/trace.json

          PUSH_STATUS=$(curl -o /tmp/push-body.txt -s -w "%{http_code}" \
            --max-time 10 \
            -X POST http://localhost:4318/v1/traces \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/trace.json)

          if [[ ! "${PUSH_STATUS}" =~ ^2 ]]; then
            echo "OTLP push failed with HTTP ${PUSH_STATUS}"
            head -c 500 /tmp/push-body.txt
            exit 1
          fi
          echo "OTLP push accepted (HTTP ${PUSH_STATUS})"

          echo "Reading the trace back from Tempo..."
          for i in $(seq 1 24); do
            # Accept either spelling of the span container: OTLP renamed
            # instrumentationLibrarySpans to scopeSpans, and which one Tempo
            # emits depends on its version.
            if curl -sf --max-time 10 \
                -H "Accept: application/json" \
                "http://localhost:3100/api/traces/${TRACE_ID}" \
                | jq -e '.batches[]?
                         | (.scopeSpans // .instrumentationLibrarySpans // [])[]?
                         | .spans[]?
                         | select(.name == "ci-smoke-span")' >/dev/null 2>&1; then
              echo "Tempo returned the span for trace ${TRACE_ID}"
              break
            fi
            if [[ ${i} -eq 24 ]]; then
              echo "Trace ${TRACE_ID} never became queryable"
              kubectl logs -n monitoring -l app.kubernetes.io/name=tempo --tail=60 || true
              exit 1
            fi
            echo "  Attempt ${i}/24: trace not queryable yet, retrying in 5s..."
            sleep 5
          done

      - name: Show ArgoCD Application statuses
        run: |
          kubectl get application -n argocd

      - name: Cleanup
        if: always()
        run: |
          k3d cluster delete homelab || true
