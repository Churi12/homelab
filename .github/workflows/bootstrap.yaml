---
name: Bootstrap Cluster and ArgoCD

on:
  push:
    branches:
      - main
      - copilot/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: Run yamllint
        run: yamllint .

      - name: Run shellcheck
        run: shellcheck bootstrap/bootstrap.sh

  bootstrap:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install k3d
        run: |
          curl -s \
            https://raw.githubusercontent.com/k3d-io/k3d/v5.6.0/install.sh \
            | bash

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.28.6

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Run bootstrap script
        run: |
          chmod +x bootstrap/bootstrap.sh
          CLEANUP_ON_EXIT=false bootstrap/bootstrap.sh

      - name: Verify ArgoCD installation
        run: |
          kubectl get deployment -n argocd
          kubectl get pods -n argocd

      - name: Check ArgoCD server
        run: |
          kubectl wait --for=condition=available \
            --timeout=60s \
            deployment/argocd-server \
            -n argocd

      - name: Verify Grafana is healthy
        run: |
          kubectl wait --for=condition=available \
            --timeout=60s \
            deployment/monitoring-grafana \
            -n monitoring
          kubectl get pods -n monitoring

      - name: Verify ingress objects are created
        run: |
          echo "Checking ArgoCD ingress..."
          kubectl get ingress -n argocd
          kubectl get ingress argocd-server -n argocd \
            -o jsonpath='{.spec.rules[0].host}'
          echo ""
          echo "Checking Grafana ingress..."
          kubectl get ingress -n monitoring
          kubectl get ingress -n monitoring \
            -o jsonpath='{.items[0].spec.rules[0].host}'
          echo ""

      - name: Verify Traefik routes answer via nip.io hostnames
        run: |
          # Use --resolve to pin the nip.io hostname to 127.0.0.1 without
          # depending on external DNS during CI.
          echo "Waiting for ArgoCD to be reachable via Traefik..."
          for i in $(seq 1 24); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --max-time 5 \
              --resolve "argocd.127.0.0.1.nip.io:80:127.0.0.1" \
              http://argocd.127.0.0.1.nip.io/ 2>/dev/null || echo "000")
            if [[ "${STATUS}" =~ ^[23] ]]; then
              echo "ArgoCD ingress OK (HTTP ${STATUS})"
              break
            fi
            if [[ ${i} -eq 24 ]]; then
              echo "ArgoCD ingress not reachable after 24 attempts (last status: ${STATUS})"
              kubectl describe ingress argocd-server -n argocd || true
              exit 1
            fi
            echo "  Attempt ${i}/24: HTTP ${STATUS}, retrying in 5s..."
            sleep 5
          done

          echo "Waiting for Grafana to be reachable via Traefik..."
          for i in $(seq 1 24); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --max-time 5 \
              --resolve "grafana.127.0.0.1.nip.io:80:127.0.0.1" \
              http://grafana.127.0.0.1.nip.io/ 2>/dev/null || echo "000")
            if [[ "${STATUS}" =~ ^[23] ]]; then
              echo "Grafana ingress OK (HTTP ${STATUS})"
              break
            fi
            if [[ ${i} -eq 24 ]]; then
              echo "Grafana ingress not reachable after 24 attempts (last status: ${STATUS})"
              kubectl describe ingress -n monitoring || true
              exit 1
            fi
            echo "  Attempt ${i}/24: HTTP ${STATUS}, retrying in 5s..."
            sleep 5
          done

      - name: Apply root app-of-apps and sync to current branch
        run: |
          TARGET_REVISION="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-main}}"
          echo "ArgoCD target revision: ${TARGET_REVISION}"
          kubectl apply -f apps/root.yaml
          kubectl patch application root -n argocd \
            --type=merge \
            -p "{\"spec\":{\"source\":{\"targetRevision\":\"${TARGET_REVISION}\"}}}"
          echo "Root Application applied and configured for branch: ${TARGET_REVISION}"

      - name: Wait for root Application to sync
        run: |
          echo "Waiting for root Application to sync..."
          for i in $(seq 1 60); do
            STATUS=$(kubectl get application root -n argocd \
              -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")
            echo "  Root sync status: ${STATUS} (attempt ${i}/60)"
            if [[ "${STATUS}" == "Synced" ]]; then
              echo "Root Application is Synced"
              break
            fi
            sleep 5
          done

      - name: Wait for demo-app Application to be discovered and patch its branch
        run: |
          TARGET_REVISION="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-main}}"
          echo "Waiting for demo-app Application to be created by root sync..."
          for i in $(seq 1 60); do
            if kubectl get application demo-app -n argocd &>/dev/null 2>&1; then
              echo "demo-app Application found after ${i} attempts"
              break
            fi
            echo "  Waiting... (attempt ${i}/60)"
            sleep 5
          done
          kubectl patch application demo-app -n argocd \
            --type=merge \
            -p "{\"spec\":{\"source\":{\"targetRevision\":\"${TARGET_REVISION}\"}}}"
          echo "demo-app Application patched for branch: ${TARGET_REVISION}"

      - name: Verify demo app pod is running and healthy
        run: |
          echo "Waiting for demo-app pod to be ready..."
          kubectl wait --for=condition=ready pod \
            -l app=demo-app \
            -n demo \
            --timeout=300s
          echo "Demo app pod is running"
          kubectl get pods -n demo

      - name: Wait for loki Application to be discovered
        run: |
          echo "Waiting for loki Application to be created by root sync..."
          for i in $(seq 1 60); do
            if kubectl get application loki -n argocd &>/dev/null 2>&1; then
              echo "loki Application found after ${i} attempts"
              break
            fi
            echo "  Waiting... (attempt ${i}/60)"
            sleep 5
          done

      - name: Wait for alloy Application to be discovered
        run: |
          echo "Waiting for alloy Application to be created by root sync..."
          for i in $(seq 1 60); do
            if kubectl get application alloy -n argocd &>/dev/null 2>&1; then
              echo "alloy Application found after ${i} attempts"
              break
            fi
            echo "  Waiting... (attempt ${i}/60)"
            sleep 5
          done

      - name: Verify Loki and Alloy are healthy
        run: |
          echo "Waiting for Loki pod to be ready..."
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=loki \
            -n logging \
            --timeout=120s
          echo "Loki pod is ready"

          echo "Waiting for Alloy DaemonSet pods to be ready..."
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=alloy \
            -n logging \
            --timeout=120s
          echo "Alloy pods are ready"

          kubectl get pods -n logging

      # Pods being ready proves nothing about log shipping: a broken Alloy
      # pipeline stays Ready and tails no files. The only honest check is to
      # ask Loki whether the demo app logs actually arrived.
      - name: Verify demo app logs actually reach Loki
        run: |
          kubectl port-forward -n logging svc/loki 3100:3100 &
          PF_PID=$!
          trap 'kill ${PF_PID} 2>/dev/null || true' EXIT

          echo "Waiting for the port-forward to accept connections..."
          for i in $(seq 1 15); do
            if curl -sf --max-time 3 http://localhost:3100/ready >/dev/null; then
              echo "Loki is ready to serve queries"
              break
            fi
            if [[ ${i} -eq 15 ]]; then
              echo "Loki did not become queryable"
              exit 1
            fi
            sleep 4
          done

          # Alloy tails files and batches pushes, so the first lines take a
          # little while to land. Retry rather than assume.
          echo "Querying Loki for logs from the demo namespace..."
          for i in $(seq 1 30); do
            STREAMS=$(curl -sG --max-time 10 \
              http://localhost:3100/loki/api/v1/query_range \
              --data-urlencode 'query={namespace="demo"}' \
              --data-urlencode 'limit=5' \
              --data-urlencode "start=$(date -u -d '30 minutes ago' +%s)000000000" \
              --data-urlencode "end=$(date -u +%s)000000000" \
              | jq '.data.result | length' 2>/dev/null || echo 0)

            if [[ "${STREAMS}" =~ ^[0-9]+$ ]] && [[ "${STREAMS}" -gt 0 ]]; then
              echo "Loki returned ${STREAMS} stream(s) for namespace demo"
              break
            fi

            if [[ ${i} -eq 30 ]]; then
              echo "No demo namespace logs in Loki after 30 attempts"
              echo "--- namespace label values Loki does know about ---"
              curl -sG --max-time 10 \
                http://localhost:3100/loki/api/v1/label/namespace/values || true
              echo ""
              echo "--- alloy logs ---"
              kubectl logs -n logging -l app.kubernetes.io/name=alloy --tail=60 || true
              exit 1
            fi
            echo "  Attempt ${i}/30: no streams yet, retrying in 5s..."
            sleep 5
          done

          echo "--- a sample of what landed ---"
          curl -sG --max-time 10 \
            http://localhost:3100/loki/api/v1/query_range \
            --data-urlencode 'query={namespace="demo"}' \
            --data-urlencode 'limit=3' \
            --data-urlencode "start=$(date -u -d '30 minutes ago' +%s)000000000" \
            --data-urlencode "end=$(date -u +%s)000000000" \
            | jq -r '.data.result[0].values[]? | .[1]' | head -3

      - name: Show ArgoCD Application statuses
        run: |
          kubectl get application -n argocd

      - name: Cleanup
        if: always()
        run: |
          k3d cluster delete homelab || true
