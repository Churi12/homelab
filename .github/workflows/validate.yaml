---
# Fast manifest validation job.
# Runs in parallel with the bootstrap job and catches typos and schema
# violations in seconds, before any cluster is created.
#
# Tools used, all pinned below so a run is reproducible:
#   kubeconform  validates manifests against Kubernetes JSON schemas
#   helm         renders every pinned chart with its inline values
#   kube-linter  checks plain manifests for common best-practice issues
#
# Every pin lives in the env block or in a with: version key, which is where
# Renovate can see and bump it. Do not repeat a version in a step name.
name: Validate Manifests

on:
  push:
    branches:
      - main
      - copilot/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.6.7
  KUBELINTER_VERSION: v0.6.8

jobs:
  validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Install PyYAML for the render script
        run: pip install pyyaml==6.0.2

      # kubeconform validates every manifest against the official Kubernetes
      # JSON schemas plus the ArgoCD CRD schemas from the datreeio catalog.
      # Resources whose schema is not found (e.g. k3d Simple) are skipped.
      - name: Install kubeconform
        run: |
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate manifests with kubeconform
        run: |
          # Only pass files that have an apiVersion field so plain values files
          # (which have no apiVersion/kind) are excluded automatically.
          find apps/ clusters/ \( -name '*.yaml' -o -name '*.yml' \) \
            | xargs grep -l '^apiVersion:' \
            | xargs kubeconform \
                -strict \
                -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -summary

      # Every Application carries its Helm values inline, so validating the
      # Application manifest alone proves nothing about those values. Render
      # each pinned chart with them, which is what ArgoCD does before it
      # applies anything, and fail if a chart cannot render.
      - name: Render every Helm Application
        run: |
          hack/render_apps.py \
            --out-dir /tmp/rendered \
            --manifest-json /tmp/stack.json

      # Validating the rendered output is the check that actually covers the
      # workloads that end up in the cluster, CRDs and all.
      - name: Validate rendered output with kubeconform
        run: |
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -summary \
            /tmp/rendered/*.yaml

      # kube-linter checks the plain Kubernetes workload manifests for common
      # security and correctness issues. The .kube-linter.yaml config in the
      # repo root scopes the checks to what is appropriate for a homelab.
      - name: Install kube-linter
        run: |
          curl -fsSL \
            "https://github.com/stackrox/kube-linter/releases/download/${KUBELINTER_VERSION}/kube-linter-linux.tar.gz" \
            | tar xz -C /tmp kube-linter
          sudo mv /tmp/kube-linter /usr/local/bin/kube-linter
          kube-linter version

      - name: Run kube-linter on plain Kubernetes manifests
        run: |
          kube-linter lint apps/demo-app/
